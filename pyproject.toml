[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cabid"
version = "0.6.0"
description = "Telemetry-aware causal behavioral analysis for Linux security research"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sayanox Research"}]
keywords = ["linux", "security", "intrusion-detection", "anomaly-detection", "sarif", "telemetry"]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
cabid = "cabid.cli:main"

[tool.setuptools.packages.find]
include = ["cabid*"]

[tool.setuptools.package-data]
cabid = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
