[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cabid"
version = "0.8.0"
description = "Telemetry-aware causal behavioral analysis for Linux security research"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sayanox Research"}]
keywords = ["linux", "security", "intrusion-detection", "anomaly-detection", "sarif", "stix", "sigma", "telemetry", "dfir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
# Core has no runtime dependencies. PyYAML is only needed for Sigma import.
sigma = ["PyYAML>=6.0"]
test = ["pytest>=8.0", "coverage[toml]>=7.0", "mypy>=1.10", "pyflakes>=3.0", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/sayan9168/CABID"
Documentation = "https://github.com/sayan9168/CABID/tree/main/docs"
Changelog = "https://github.com/sayan9168/CABID/blob/main/CHANGELOG.md"
Security = "https://github.com/sayan9168/CABID/blob/main/SECURITY.md"
Issues = "https://github.com/sayan9168/CABID/issues"

[project.scripts]
cabid = "cabid.cli:main"

[tool.setuptools.packages.find]
include = ["cabid*"]

[tool.setuptools.package-data]
cabid = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["cabid"]

[tool.coverage.report]
# A floor, not a target: the suite currently sits in the low 90s. Lowering this
# number to make a change pass is the wrong fix; add the test instead.
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
files = ["cabid"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = false
