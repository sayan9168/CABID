name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q cabid tests
      - run: pytest
      - run: cabid --version
      - name: Synthetic benchmark
        run: cabid benchmark --output /tmp/cabid-benchmark.json --seed 42 --per-class 5
      - name: Assert benchmark shape
        run: |
          python - <<'PY'
          import json
          report = json.load(open('/tmp/cabid-benchmark.json'))
          assert report['models']['cabid_with_baseline']['sample_count'] == 15
          assert report['models']['cabid_core']['sample_count'] == 15
          assert report['models']['temporal_only']['sample_count'] == 15
          assert set(report['scenario_metrics']) == {
              'benign_regular', 'synthetic_behavior_anomaly', 'telemetry_loss'}
          PY
      - name: Report formats
        run: |
          cabid init-config -o /tmp/cabid-config.json
          cabid build-baseline datasets/synthetic/example.jsonl datasets/synthetic/example.jsonl \
            datasets/synthetic/example.jsonl -o /tmp/baseline.json --min-sessions 2
          for fmt in json md csv sarif html; do
            cabid analyze datasets/synthetic/example.jsonl -c /tmp/cabid-config.json \
              -b /tmp/baseline.json --window 20 --format "$fmt" -o "/tmp/report.$fmt" --quiet
            test -s "/tmp/report.$fmt"
          done
      - name: SARIF is valid JSON with a tool driver
        run: |
          python -c "import json;d=json.load(open('/tmp/report.sarif'));assert d['runs'][0]['tool']['driver']['name']=='CABID'"
      - name: Doctor and exit codes
        run: |
          cabid doctor --format json > /tmp/doctor.json
          python -c "import json;assert json.load(open('/tmp/doctor.json'))['ready'] is True"
          cabid analyze datasets/synthetic/example.jsonl --fail-on HIGH_RISK --quiet -o /tmp/r.json
      - name: Multi-source, time filter and history
        run: |
          cabid analyze datasets/synthetic/example.jsonl datasets/synthetic/suspicious-example.jsonl \
            --since 2025-10-09T00:00:00Z --format json -o /tmp/merged.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/merged.json'))
          assert report['sources']['source_count'] == 2
          assert report['time_filter']['active'] is True
          assert report['entities']['entity_count'] >= 1
          PY
          cabid analyze datasets/synthetic/example.jsonl --history-db /tmp/history.sqlite3 \
            --save-history --label calm -o /tmp/calm.json --quiet
          cabid analyze datasets/synthetic/suspicious-example.jsonl --history-db /tmp/history.sqlite3 \
            --save-history --label noisy --compare-history 1 -o /tmp/noisy.json --quiet
          cabid history --db /tmp/history.sqlite3 --compare 1 2 --format json > /tmp/hcmp.json
          python - <<'PY'
          import json
          comparison = json.load(open('/tmp/hcmp.json'))['comparison']
          assert comparison['status_changed'] is True
          assert comparison['score_delta'] > 0
          report = json.load(open('/tmp/noisy.json'))
          assert report['history_comparison']['new_reason_codes']
          assert report['entities']['flagged_entity_count'] >= 1
          PY
          python - <<'PY'
          # The history database must never contain raw event content.
          blob = open('/tmp/history.sqlite3', 'rb').read()
          for needle in (b'/etc/shadow', b'/tmp/.build/worker', b'10.0.0.9'):
              assert needle not in blob, f'history leaked {needle!r}'
          print('history content check ok')
          PY
      - name: Correlation rules, tree, timeline and sealing
        run: |
          cabid analyze datasets/synthetic/tree-example.jsonl --format json -o /tmp/tree.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/tree.json'))
          assert report['tree']['cycle_count'] >= 1
          assert report['tree']['max_depth'] >= 4
          kinds = {f['kind'] for f in report['tree']['findings']}
          assert 'interpreter_spawn' in kinds
          ids = {f['rule_id'] for f in report['rules']['findings']}
          assert 'shell-from-service' in ids
          assert 'download-then-exec' in ids
          # rule and tree output must not move the headline score
          assert 'anomaly_score' in report and isinstance(report['components'], dict)
          PY
          cabid analyze datasets/synthetic/tree-example.jsonl --no-rules --no-tree             --format json -o /tmp/bare.json
          python -c "import json;d=json.load(open('/tmp/bare.json'));assert 'rules' not in d and 'tree' not in d"
          cabid timeline datasets/synthetic/tree-example.jsonl -f json --limit 4 -o /tmp/tl.json
          python -c "import json;d=json.load(open('/tmp/tl.json'));assert d['row_count']==4 and d['truncated'];print('timeline ok')"
          cabid analyze datasets/synthetic/example.jsonl --sign -o /tmp/sealed.json --quiet
          cabid seal /tmp/sealed.json --verify --quiet > /tmp/seal.json
          python -c "import json;assert json.load(open('/tmp/seal.json'))['verified'] is True"
          python - <<'PY'
          import json
          doc = json.load(open('/tmp/sealed.json'))
          doc['anomaly_score'] = 0.99
          json.dump(doc, open('/tmp/tampered.json', 'w'))
          PY
          if cabid seal /tmp/tampered.json --verify --quiet > /tmp/tamper.json; then
            echo "tampered report verified; sealing is broken"; exit 1
          fi
          python -c "import json;assert json.load(open('/tmp/tamper.json'))['verified'] is False;print('tamper detected')"
      - name: Dashboard smoke test
        run: |
          python - <<'PY'
          import json, threading, urllib.request
          from cabid.server import serve
          httpd = serve('127.0.0.1', 0)
          threading.Thread(target=httpd.serve_forever, daemon=True).start()
          host, port = httpd.server_address[:2]
          base = f'http://{host}:{port}'
          health = json.load(urllib.request.urlopen(base + '/api/health'))
          assert health['status'] == 'ok'
          body = json.dumps({'events': [{'timestamp': 1, 'event_type': 'heartbeat', 'process_id': 1}]}).encode()
          request = urllib.request.Request(base + '/api/analyze', data=body,
                                          headers={'Content-Type': 'application/json'})
          report = json.load(urllib.request.urlopen(request))
          assert report['status'] == 'INSUFFICIENT_EVIDENCE'
          page = urllib.request.urlopen(base + '/').read()
          assert b'CABID' in page
          httpd.shutdown()
          httpd.server_close()
          print('dashboard ok')
          PY
