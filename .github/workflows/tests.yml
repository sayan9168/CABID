name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - name: pyflakes
        run: pyflakes cabid tests
      - name: mypy
        run: mypy cabid
      - name: coverage floor (90%)
        run: |
          coverage run -m pytest
          coverage report --skip-covered
          coverage report --fail-under=90 > /dev/null
      - name: build the distribution
        run: |
          python -m pip install build
          python -m build --outdir /tmp/dist
          python -m pip install --force-reinstall /tmp/dist/*.whl
          cabid --version
          python -m cabid --version

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q cabid tests
      - run: pytest
      - run: cabid --version
      - name: Synthetic benchmark
        run: cabid benchmark --output /tmp/cabid-benchmark.json --seed 42 --per-class 5
      - name: Assert benchmark shape
        run: |
          python - <<'PY'
          import json
          report = json.load(open('/tmp/cabid-benchmark.json'))
          assert report['models']['cabid_with_baseline']['sample_count'] == 15
          assert report['models']['cabid_core']['sample_count'] == 15
          assert report['models']['temporal_only']['sample_count'] == 15
          assert set(report['scenario_metrics']) == {
              'benign_regular', 'synthetic_behavior_anomaly', 'telemetry_loss'}
          PY
      - name: Report formats
        run: |
          cabid init-config -o /tmp/cabid-config.json
          cabid build-baseline datasets/synthetic/example.jsonl datasets/synthetic/example.jsonl \
            datasets/synthetic/example.jsonl -o /tmp/baseline.json --min-sessions 2
          for fmt in json md csv sarif html; do
            cabid analyze datasets/synthetic/example.jsonl -c /tmp/cabid-config.json \
              -b /tmp/baseline.json --window 20 --format "$fmt" -o "/tmp/report.$fmt" --quiet
            test -s "/tmp/report.$fmt"
          done
      - name: SARIF is valid JSON with a tool driver
        run: |
          python -c "import json;d=json.load(open('/tmp/report.sarif'));assert d['runs'][0]['tool']['driver']['name']=='CABID'"
      - name: Doctor and exit codes
        run: |
          cabid doctor --format json > /tmp/doctor.json
          python -c "import json;assert json.load(open('/tmp/doctor.json'))['ready'] is True"
          cabid analyze datasets/synthetic/example.jsonl --fail-on HIGH_RISK --quiet -o /tmp/r.json
      - name: Multi-source, time filter and history
        run: |
          cabid analyze datasets/synthetic/example.jsonl datasets/synthetic/suspicious-example.jsonl \
            --since 2025-10-09T00:00:00Z --format json -o /tmp/merged.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/merged.json'))
          assert report['sources']['source_count'] == 2
          assert report['time_filter']['active'] is True
          assert report['entities']['entity_count'] >= 1
          # clock skew is estimated but never applied
          assert report['sources']['clock_skew']['applied'] is False
          PY
          cabid analyze datasets/synthetic/example.jsonl --history-db /tmp/history.sqlite3 \
            --save-history --label calm -o /tmp/calm.json --quiet
          cabid analyze datasets/synthetic/suspicious-example.jsonl --history-db /tmp/history.sqlite3 \
            --save-history --label noisy --compare-history 1 -o /tmp/noisy.json --quiet
          cabid history --db /tmp/history.sqlite3 --compare 1 2 --format json > /tmp/hcmp.json
          python - <<'PY'
          import json
          comparison = json.load(open('/tmp/hcmp.json'))['comparison']
          assert comparison['status_changed'] is True
          assert comparison['score_delta'] > 0
          report = json.load(open('/tmp/noisy.json'))
          assert report['history_comparison']['new_reason_codes']
          assert report['entities']['flagged_entity_count'] >= 1
          PY
          python - <<'PY'
          # The history database must never contain raw event content.
          blob = open('/tmp/history.sqlite3', 'rb').read()
          for needle in (b'/etc/shadow', b'/tmp/.build/worker', b'10.0.0.9'):
              assert needle not in blob, f'history leaked {needle!r}'
          print('history content check ok')
          PY
      - name: Correlation rules, tree, timeline and sealing
        run: |
          cabid analyze datasets/synthetic/tree-example.jsonl --format json -o /tmp/tree.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/tree.json'))
          assert report['tree']['cycle_count'] >= 1
          assert report['tree']['max_depth'] >= 4
          kinds = {f['kind'] for f in report['tree']['findings']}
          assert 'interpreter_spawn' in kinds
          ids = {f['rule_id'] for f in report['rules']['findings']}
          assert 'shell-from-service' in ids
          assert 'download-then-exec' in ids
          # rule and tree output must not move the headline score
          assert 'anomaly_score' in report and isinstance(report['components'], dict)
          assert report['containers']['container_aware'] is False
          PY
          cabid analyze datasets/synthetic/tree-example.jsonl --no-rules --no-tree             --format json -o /tmp/bare.json
          python -c "import json;d=json.load(open('/tmp/bare.json'));assert 'rules' not in d and 'tree' not in d"
          cabid timeline datasets/synthetic/tree-example.jsonl -f json --limit 4 -o /tmp/tl.json
          python -c "import json;d=json.load(open('/tmp/tl.json'));assert d['row_count']==4 and d['truncated'];print('timeline ok')"
          cabid analyze datasets/synthetic/example.jsonl --sign -o /tmp/sealed.json --quiet
          cabid seal /tmp/sealed.json --verify --quiet > /tmp/seal.json
          python -c "import json;assert json.load(open('/tmp/seal.json'))['verified'] is True"
          python - <<'PY'
          import json
          doc = json.load(open('/tmp/sealed.json'))
          doc['anomaly_score'] = 0.99
          json.dump(doc, open('/tmp/tampered.json', 'w'))
          PY
          if cabid seal /tmp/tampered.json --verify --quiet > /tmp/tamper.json; then
            echo "tampered report verified; sealing is broken"; exit 1
          fi
          python -c "import json;assert json.load(open('/tmp/tamper.json'))['verified'] is False;print('tamper detected')"
      - name: Score explanation recomputes
        run: |
          cabid analyze datasets/synthetic/tree-example.jsonl --explain-score \
            -o /tmp/explained.json --quiet
          python - <<'PY'
          import json
          report = json.load(open('/tmp/explained.json'))
          explanation = report['score_explanation']
          assert explanation['recomputes_consistently'] is True
          assert abs(explanation['recomputed_score'] - report['anomaly_score']) < 1e-6
          assert len(explanation['steps']) == 5
          PY
      - name: Sigma import and STIX export round trip
        run: |
          cabid import-sigma docs/cabid-sigma.example.yml -o /tmp/sigma-pack.json
          python - <<'PY'
          import json
          document = json.load(open('/tmp/sigma-pack.json'))
          assert document['provenance']['unsupported'] == []
          assert document['format'].startswith('cabid-rules/')
          PY
          cabid analyze datasets/synthetic/tree-example.jsonl -r /tmp/sigma-pack.json \
            -o /tmp/sigma-report.json --quiet
          python -c "import json;d=json.load(open('/tmp/sigma-report.json'));assert d['rules']['rule_count']==1"
          cabid export-stix /tmp/tree.json -o /tmp/bundle.json --host web-01
          python - <<'PY'
          import json
          bundle = json.load(open('/tmp/bundle.json'))
          assert bundle['type'] == 'bundle' and bundle['spec_version'] == '2.1'
          kinds = {}
          for item in bundle['objects']:
              kinds[item['type']] = kinds.get(item['type'], 0) + 1
          assert kinds['identity'] == 1 and kinds['report'] == 1
          indicators = [i for i in bundle['objects'] if i['type'] == 'indicator']
          assert indicators and all(i['pattern_type'] == 'cabid-heuristic' for i in indicators)
          assert all(i['x_cabid_semantics'] == 'pattern match, not a verdict' for i in indicators)
          report = [i for i in bundle['objects'] if i['type'] == 'report'][0]
          children = {i['id'] for i in bundle['objects'] if i['type'] in {'indicator', 'note'}}
          assert set(report['object_refs']) == children
          PY
      - name: Container-aware analysis
        run: |
          python - <<'PY'
          import json
          rows = [
              {'timestamp': 1, 'event_type': 'process_start', 'process_id': 1,
               'parent_process_id': 0, 'process_name': 'nginx', 'container_id': 'abc123'},
              {'timestamp': 2, 'event_type': 'process_start', 'process_id': 42,
               'parent_process_id': 1, 'process_name': 'php', 'container_id': 'abc123'},
              {'timestamp': 3, 'event_type': 'process_start', 'process_id': 42,
               'parent_process_id': 0, 'process_name': 'java', 'container_id': 'def456'},
          ]
          open('/tmp/container.jsonl', 'w').write('\n'.join(json.dumps(r) for r in rows) + '\n')
          PY
          cabid analyze /tmp/container.jsonl -o /tmp/container.json --quiet
          python - <<'PY'
          import json
          report = json.load(open('/tmp/container.json'))
          containers = report['containers']
          assert containers['container_aware'] is True
          assert containers['scope_count'] == 2
          assert containers['collision_count'] == 1
          PY
      - name: Response plans are gated and audited
        run: |
          cabid analyze datasets/synthetic/tree-example.jsonl -o /tmp/plan-report.json
          cabid respond /tmp/plan-report.json -o /tmp/plan-report.response.json
          python - <<'PY'
          import json
          plan = json.load(open('/tmp/plan-report.response.json'))
          assert plan['format'] == 'cabid-response/1'
          assert len(plan['plan_digest']) == 64
          # Incomplete telemetry must never produce a destructive recommendation.
          if not plan['based_on']['telemetry_sufficient']:
              assert all(not d['destructive'] for d in plan['decisions'])
          assert all(d['blast_radius'] for d in plan['decisions'])
          gates = {g['gate'] for g in plan['gates']}
          assert {'protected_process', 'kill_chain_corroboration',
                  'telemetry_sufficiency', 'plan_budget', 'containment_loop'} <= gates
          PY
      - name: Applying without a digest is refused
        run: |
          if cabid respond /tmp/plan-report.json --apply 2>/tmp/no-confirm.err; then
            echo "applied without --confirm: the gate is broken"; exit 1
          fi
          grep -q "refusing to apply without --confirm" /tmp/no-confirm.err
          echo "confirm gate held"
      - name: An edited plan is refused before anything runs
        run: |
          python - <<'PY'
          import json
          path = '/tmp/plan-report.response.json'
          plan = json.load(open(path))
          if plan['decisions']:
              plan['decisions'][0]['recommended_action'] = 'kill_process'
              plan['decisions'][0]['destructive'] = True
          else:
              plan['based_on']['anomaly_score'] = 0.99
          json.dump(plan, open(path, 'w'))
          PY
          if cabid respond /tmp/plan-report.json --apply --dry-run 2>/tmp/tamper.err; then
            echo "tampered plan accepted: the digest is not binding"; exit 1
          fi
          grep -q "edited after review" /tmp/tamper.err
          echo "digest binding held"
      - name: Dry run and audit trail
        run: |
          cabid respond /tmp/plan-report.json -o /tmp/plan-report.response.json -q
          cabid respond /tmp/plan-report.json --apply --dry-run > /tmp/dry.json
          python -c "import json;d=json.load(open('/tmp/dry.json'));assert d['executed'] is False"
          DIGEST=$(python -c "import json;print(json.load(open('/tmp/plan-report.response.json'))['plan_digest'])")
          cabid respond /tmp/plan-report.json --apply --confirm "$DIGEST"             --audit /tmp/plan-audit.jsonl --quarantine-dir /tmp/q -q
          python - <<'PY'
          import json
          entries = [json.loads(line) for line in open('/tmp/plan-audit.jsonl')]
          assert entries[0]['event'] == 'plan_start'
          assert entries[-1]['event'] == 'plan_end'
          assert all(e['format'] == 'cabid-audit/1' for e in entries)
          print('audit trail ok:', len(entries), 'entries')
          PY
      - name: Baseline drift suggestions
        run: |
          cabid build-baseline datasets/synthetic/example.jsonl datasets/synthetic/example.jsonl \
            -o /tmp/drift-profile.json --min-sessions 2
          cabid baseline-drift /tmp/drift-profile.json datasets/synthetic/example.jsonl \
            -o /tmp/drift.json --min-support 1
          python -c "import json;d=json.load(open('/tmp/drift.json'));assert d['applied'] is False"
      - name: Dashboard smoke test
        run: |
          python - <<'PY'
          import json, threading, urllib.request
          from cabid.server import serve
          httpd = serve('127.0.0.1', 0)
          threading.Thread(target=httpd.serve_forever, daemon=True).start()
          host, port = httpd.server_address[:2]
          base = f'http://{host}:{port}'
          health = json.load(urllib.request.urlopen(base + '/api/health'))
          assert health['status'] == 'ok'
          body = json.dumps({'events': [{'timestamp': 1, 'event_type': 'heartbeat', 'process_id': 1}]}).encode()
          request = urllib.request.Request(base + '/api/analyze', data=body,
                                          headers={'Content-Type': 'application/json'})
          report = json.load(urllib.request.urlopen(request))
          assert report['status'] == 'INSUFFICIENT_EVIDENCE'
          page = urllib.request.urlopen(base + '/').read()
          assert b'CABID' in page
          httpd.shutdown()
          httpd.server_close()
          print('dashboard ok')
          PY
