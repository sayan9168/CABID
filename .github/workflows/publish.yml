name: publish

# Publishes to PyPI when a GitHub release is published, using PyPI Trusted
# Publishing (OIDC). No API token is stored in this repository.
#
# One-time setup, done by a repository owner on PyPI:
#   PyPI -> Your projects -> Publishing -> Add a new pending publisher
#     PyPI project name: cabid
#     Owner:             sayan9168
#     Repository:        CABID
#     Workflow name:     publish.yml
#     Environment:       pypi
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and check only; do not upload'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build twine
      - name: The tag must match the packaged version
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import pathlib, re, sys
          version = re.search(r'__version__ = "([^"]+)"',
                              pathlib.Path('cabid/__init__.py').read_text()).group(1)
          tag = '${{ github.event.release.tag_name }}'.lstrip('v')
          if tag != version:
              sys.exit(f'tag {tag!r} does not match cabid/__init__.py {version!r}')
          print(f'version {version} matches the tag')
          PY
      - run: python -m build --outdir dist
      - run: python -m twine check --strict dist/*
      - name: Install the wheel and run a smoke test
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cabid --version
          cabid analyze datasets/synthetic/example.jsonl -f json -o /tmp/smoke.json -q
          test -s /tmp/smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: upload to PyPI
    needs: build
    if: github.event_name == 'release' || inputs.dry-run == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cabid
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Fails loudly rather than overwriting an existing release.
          attestations: true
